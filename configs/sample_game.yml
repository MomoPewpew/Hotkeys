name: Example Game
match:
  wm_class_contains:
    - steam_app
  title_contains:
    - Example Game
macro_profile_cycle_hotkey: alt+num_pad0
selected_macro_profile: warrior
macro_profile_order: [warrior, wizard]
macros:
  - name: rapid_fire
    trigger:
      key: f8
      behavior: toggle_loop  # once | toggle_loop | hold_loop
    actions:
      - type: tap_mouse
        button: left
      - type: delay
        ms: 120
  - name: dodge
    trigger:
      key: space
      behavior: once
    actions:
      - type: tap_key
        key: shift

macros_warrior:
  - name: warrior_shout
    trigger: { key: button12, behavior: once }
    actions:
      - { type: tap_key, key: g }

macros_wizard:
  - name: wizard_blink
    trigger: { key: button12, behavior: once }
    actions:
      - { type: tap_key, key: r }

