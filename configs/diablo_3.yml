name: Diablo III
match:
  wm_class_contains:
  - steam_app_default
  title_contains:
  - Diablo III
macro_profile_cycle_hotkey: alt+num_pad1
selected_macro_profile: tal
macro_profile_order:
- firebird
- tal
macros_tal:
- name: tal_faceroll
  trigger:
    key: button13
    behavior: toggle_loop
  actions:
  - type: mouse_down
    button: left
  - type: delay
    ms: 5
  - type: key_down
    key: a
  - type: delay
    ms: 5
  - type: key_down
    key: w
  - type: delay
    ms: 5
  - type: key_down
    key: d
  - type: delay
    ms: 10
  - type: mouse_up
    button: left
  - type: delay
    ms: 5
  - type: key_up
    key: a
  - type: delay
    ms: 5
  - type: key_up
    key: w
  - type: delay
    ms: 5
  - type: key_up
    key: d
  - type: delay
    ms: 10
macros_firebird:
- name: auto_click_left
  trigger:
    key: button13
    behavior: toggle_loop
  actions:
  - type: mouse_down
    button: left
  - type: delay
    ms: 25
  - type: mouse_up
    button: left
  - type: delay
    ms: 25
- name: spam_d
  trigger:
    key: button12
    behavior: toggle_loop
  actions:
  - type: tap_key
    key: d
  - type: delay
    ms: 50
