name: Diablo III
match:
  wm_class_contains:
    - "steam_app_default"
  title_contains:
    - "Diablo III"
macro_profile_cycle_hotkey: alt+num_pad1
selected_macro_profile: firebird
macro_profile_order: [firebird, tal]
macros_tal:
  - name: tal_faceroll
    trigger: { key: button13, behavior: toggle_loop }
    actions:
    - { type: mouse_down, button: left }
    - { type: delay, ms: 20 }
    - { type: mouse_up, button: left }
    - { type: delay, ms: 20 }
    - { type: key_down, key: a }
    - { type: delay, ms: 20 }
    - { type: key_up, key: a }
    - { type: delay, ms: 20 }
    - { type: key_down, key: w }
    - { type: delay, ms: 20 }
    - { type: key_up, key: w }
    - { type: delay, ms: 20 }
    #- { type: key_down, key: d }
    #- { type: delay, ms: 20 }
    #- { type: key_up, key: d }
    #- { type: delay, ms: 20 }
macros_firebird:
  - name: toggle_right
    trigger: { key: button13, behavior: cycle }
    actions-1:
      - { type: mouse_down, button: right }
    actions-2:
      - { type: mouse_up, button: right }
  - name: spam_d
    trigger: { key: button13, behavior: toggle_loop }
    actions:
    - { type: tap_key, key: d }
    - { type: tap_key, key: q }
    - { type: delay, ms: 50 }
